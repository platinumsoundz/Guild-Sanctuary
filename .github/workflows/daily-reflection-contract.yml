name: Daily Reflection Contract

on:
  pull_request:
    paths:
      - 'src/modules/practice/**'
      - 'src/components/AppWorkspace.tsx'
      - 'scripts/check-daily-reflection-contract.mjs'
      - '.github/workflows/daily-reflection-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-reflection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-daily-reflection-contract.mjs
