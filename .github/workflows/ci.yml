name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check:framework-security
      - run: npm run check:pwa
      - run: npm run check:auth
      - run: npm run check:account-settings
      - run: npm run check:messages
      - run: npm run check:self-discovery
      - run: npm run check:daily-reflection
      - run: npm run check:navigation
      - run: npm run check:feed-polish
      - run: npm run check:event-time
      - run: npm run check:personal-planner
      - run: npm run check:personal-habits
      - run: npm run check:theme
      - run: npm run check:theme-contrast
      - run: npm run check:notifications
      - run: deno check supabase/functions/token-checkout/index.ts supabase/functions/stripe-token-webhook/index.ts
      - run: npm run typecheck
      - run: npm run build
