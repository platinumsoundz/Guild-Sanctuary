name: Sanctuary Cloudflare deployment

on:
  # Quota-saver: build/deploy only from main; PRs use the regular CI workflow.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctuary-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://build-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'build-placeholder-anon-key' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_SUPABASE_CONFIG: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
      NEXT_PUBLIC_SANCTUARY_PERSISTENT_MESSAGES: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Cloudflare adapter and Wrangler
        run: npm install --no-save @opennextjs/cloudflare@1.20.13 wrangler@latest

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        # Production deploys stay explicit/manual until the integration batch is ready.
        if: github.event_name == 'workflow_dispatch' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.HAS_SUPABASE_CONFIG == 'true'
        run: npx opennextjs-cloudflare deploy

      - name: Explain skipped deployment
        if: github.event_name != 'workflow_dispatch'
        run: echo "::notice::Build only. Production deployment is intentionally manual via workflow dispatch during release preparation."

      - name: Explain missing deployment configuration
        if: github.event_name == 'workflow_dispatch' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.HAS_SUPABASE_CONFIG != 'true')
        run: echo "::notice::Build passed, but deployment was skipped because Cloudflare write credentials or live Supabase configuration are missing. Add the required repository secrets to enable deployment."
