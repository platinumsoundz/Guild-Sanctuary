name: Phase 1 dependency map contract

on:
  pull_request:
    paths:
      - docs/reports/phase1-dependency-map-2026-10-27.md
      - scripts/check-phase1-dependency-map.mjs
      - .github/workflows/phase1-dependency-map.yml
      - docs/SUPABASE_MIGRATION_DRIFT_INVENTORY_2026-10-26.md
      - supabase/migrations/**
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-map-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-phase1-dependency-map.mjs
